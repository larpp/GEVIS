[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gevis-encoder"
version = "0.1.0"
description = "Question-conditioned multimodal time-series Fusion encoder"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2,<3", "numpy>=1.26,<3"]

[project.optional-dependencies]
text = ["transformers>=4.40,<5", "sentencepiece>=0.2"]
fdc = ["pandas>=2.2,<3", "transformers>=4.40,<5", "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4"]
test = ["pytest>=8,<10"]
notebook = ["ipykernel>=6", "ipywidgets>=8"]
docs = ["matplotlib>=3.8,<4", "pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["GEVIS_Model*", "heads*", "pecvd*"]
exclude = ["heads._legacy_training*"]

[tool.pytest.ini_options]
testpaths = ["tests/portable"]
